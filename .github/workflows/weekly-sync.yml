name: Weekly Gym Data Sync

on:
  schedule:
    # Runs every Sunday at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    name: Sync FitPass and FitSquare Catalogs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Fetch FitSquare Data
        run: node scripts/fetch_fitsquare.js

      - name: Merge & Deduplicate Platforms
        run: node scripts/merge_platforms.js

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_fitsquare_raw.json studios_data.json studios_data.js
          if git diff --staged --quiet; then
            echo "No data changes detected. Everything is up to date."
          else
            git commit -m "chore(data): automated weekly multi-platform sync [skip ci]"
            git push origin main
          fi
